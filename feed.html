<!doctype html>
<html lang="en" data-theme="amber" data-scanlines="on" data-motion="on" data-density="cosy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed · Snack Approval</title>
<meta name="description" content="Every snack request ever filed, searchable.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script>window.PAGE = "feed";</script>
</head>
<body>
<main>
  <div class="panel stack">
    <input type="search" id="search" placeholder="Search snack, person, or reason…" autocomplete="off">
    <div class="seg" id="feedfilter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="pending" aria-pressed="false">Pending</button>
      <button data-f="approved" aria-pressed="false">Approved</button>
      <button data-f="denied" aria-pressed="false">Denied</button>
      <button data-f="mine" aria-pressed="false">Mine</button>
      <button data-f="photo" aria-pressed="false">With photo</button>
    </div>
    <div class="tiny faint" id="feedcount"></div>
  </div>

  <div class="panel flush" id="feed" style="margin-top:16px"><div class="empty">Loading…</div></div>

  <div style="margin-top:12px;text-align:center">
    <button class="btn btn-sm" id="feedmore" style="display:none">Show more</button>
  </div>
</main>

<script src="/client/quick.js"></script>
<script src="/js/core.js"></script>
<script src="/js/sfx.js"></script>
<script src="/js/views.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/dev-seed.js"></script>
<script src="/js/page-feed.js"></script>
</body>
</html>
